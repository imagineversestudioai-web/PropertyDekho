<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>View property — PropertyLooks</title>
    <meta name="description" content="Browse live Lucknow house and land demand." />
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="page">
    <a class="skip" href="#main">Skip to content</a>
    <header class="wrap">
      <nav class="nav" aria-label="Primary">
        <a class="brand" href="index.html">Property<span>Looks</span></a>
        <div class="nav-links">
          <a href="list.html">List</a>
          <a href="clients.html">Clients</a>
          <a href="view.html" aria-current="page">View property</a>
        </div>
      </nav>
    </header>
    <main id="main" class="wrap">
      <div class="page-head">
        <p class="eyebrow">Lucknow · Connected demand</p>
        <h1>View property</h1>
        <p>Live board. Jo koi list kare, yahin dikhega. Filter: house, land, locality.</p>
      </div>
      <p id="posted-note" class="alert" hidden>Your demand is on the board.</p>
      <div class="toolbar">
        <div class="chips" role="group" aria-label="Filter by type">
          <button class="chip" type="button" data-type-filter="all" aria-pressed="true">All</button>
          <button class="chip" type="button" data-type-filter="house" aria-pressed="false">House</button>
          <button class="chip" type="button" data-type-filter="land" aria-pressed="false">Land</button>
        </div>
        <label class="sr-only" for="filter-locality">Locality</label>
        <select id="filter-locality" class="locality-filter">
          <option value="">All localities</option>
        </select>
      </div>
      <p id="result-count" class="count"></p>
      <section id="demand-list" class="demand-list" aria-live="polite"></section>
      <div id="empty-state" class="empty" hidden>
        <h2>Abhi koi demand nahi</h2>
        <p>Board khali hai. Pehli demand list karo.</p>
        <p><a class="btn btn-primary" href="list.html">List a demand</a></p>
      </div>
    </main>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="js/store.js"></script>
    <script src="js/localities.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
