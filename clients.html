<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clients — PropertyLooks</title>
    <meta name="description" content="Write your property requirement on PropertyLooks." />
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="page form-page clients-page">
    <a class="skip" href="#main">Skip to content</a>
    <header class="wrap">
      <nav class="nav" aria-label="Primary">
        <a class="brand" href="index.html">Property<span>Dekho</span></a>
        <div class="nav-links">
          <a href="list.html">List</a>
          <a href="clients.html" aria-current="page">Clients</a>
          <a href="view.html">View property</a>
        </div>
      </nav>
    </header>
    <main id="main" class="wrap">
      <div class="page-head">
        <p class="eyebrow">Clients</p>
        <h1>Write your requirement</h1>
      </div>
      <form id="client-form" class="panel" novalidate>
        <p id="client-error" class="alert error" hidden tabindex="-1"></p>
        <p id="client-posted" class="alert" hidden>Requirement board pe aa gayi.</p>
        <div class="form-grid client-grid">
          <div class="field">
            <label for="client-name">Name</label>
            <input id="client-name" name="name" placeholder="Your name" autocomplete="name" />
          </div>
          <div class="field">
            <label for="client-contact">Contact</label>
            <input id="client-contact" name="contact" placeholder="Phone or email" autocomplete="tel" />
          </div>
          <div class="field wide">
            <label for="client-location">Location</label>
            <input id="client-location" name="location" placeholder="Any place" autocomplete="off" />
          </div>
          <div class="field full">
            <label for="client-requirement">Requirement</label>
            <textarea
              id="client-requirement"
              name="requirement"
              rows="3"
              placeholder="Jo chahiye woh yahin likho — house, land, budget, area..."
            ></textarea>
          </div>
        </div>
        <div class="actions">
          <button class="btn btn-primary" type="submit">Post requirement</button>
          <a class="btn btn-ghost" href="index.html">Back</a>
        </div>
      </form>
      <p id="client-count" class="count"></p>
      <section id="client-list" class="demand-list" aria-live="polite"></section>
      <div id="client-empty" class="empty" hidden>
        <h2>Abhi koi requirement nahi</h2>
        <p>Pehli client requirement yahin likho.</p>
      </div>
    </main>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="js/store.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
